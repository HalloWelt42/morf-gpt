[project]
name = "morf-transkription"
description = "morf-gpt - eigener Transkriptionsdienst (Whisper) mit Arbeiterpool"
requires-python = ">=3.12"
dynamic = ["version"]
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Apple Silicon: Whisper über MLX (Grafikeinheit), schnellster Weg auf dem Mac
mlx = ["mlx-whisper>=0.4"]
# Alle anderen Rechner: Whisper über CTranslate2 (Prozessor oder CUDA)
cpu = ["faster-whisper>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools]
packages = ["app", "app.engines"]

[tool.setuptools.dynamic]
version = {attr = "app.version.VERSION"}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: File() und Form() in Parametervorgaben ist der FastAPI-Stil
ignore = ["B008"]
